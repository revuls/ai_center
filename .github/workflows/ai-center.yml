name: AI Center

on:
  pull_request:
    paths: ['library/**', 'assets/js/core.js', 'cli/**']
  push:
    branches: [main]
    paths: ['library/**']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate the library
        run: node cli/aic.mjs lint
      - name: Check the bundle is up to date
        run: |
          node cli/aic.mjs bundle
          # The generation date always changes: compare ignoring the generatedAt line
          git diff -U0 library/library.bundle.js | grep -E '^[+-][^+-]' | grep -v generatedAt && { echo "::error::Run 'node cli/aic.mjs bundle' and commit library.bundle.js"; exit 1; } || true
      - name: Generate exports (artifact)
        run: node cli/aic.mjs export all --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: ai-center-export
          path: dist
